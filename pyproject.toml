[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droidso-long_toolchain_context_reclaim_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测图像分割研究员·长工具链的上下文回收相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "droidso" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://droidso.github.io"
Repository = "https://github.com/droidso/long_toolchain_context_reclaim_consistency_check"
Issues = "https://github.com/droidso/long_toolchain_context_reclaim_consistency_check/issues"

[project.scripts]
long_toolchain_context_reclaim_consistency_check = "long_toolchain_context_reclaim_consistency_check:main"

[tool.setuptools]
py-modules = ["long_toolchain_context_reclaim_consistency_check"]
